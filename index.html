<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatterly — simple, secure messaging (demo)</title>
  <meta name="description" content="A WhatsApp-style messenger built with pure vanilla JavaScript. Chat list, message bubbles, delivery ticks, typing indicators and simulated replies — all stored locally in your browser." />
  <meta property="og:title" content="Chatterly — WhatsApp-style chat in vanilla JS" />
  <meta property="og:description" content="A WhatsApp-style messenger built with pure vanilla JavaScript." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#111b21" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#chat-list">Skip to chat list</a>

  <div class="app">
    <!-- ============ CHAT LIST PANE ============ -->
    <aside class="list-pane" aria-label="Chats">
      <header class="list-head">
        <div class="brand-row">
          <span class="avatar me" aria-hidden="true">you</span>
          <div class="brand">
            <b>Chatterly</b>
            <span>a vanilla-JS demo messenger</span>
          </div>
          <button class="icon-btn" id="new-chat-btn" type="button" aria-label="New chat (demo)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="sr-only" for="search">Search chats</label>
          <input id="search" type="search" placeholder="Search or start a new chat" autocomplete="off" />
        </div>
      </header>
      <div id="chat-list" class="chat-list" role="list" aria-label="Chat list"></div>
      <p id="list-empty" class="list-empty" hidden>No chats match your search.</p>
      <footer class="list-foot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        Your chats stay on this device
      </footer>
    </aside>

    <!-- ============ CHAT PANE ============ -->
    <section class="chat-pane" id="chat-pane" aria-label="Conversation">
      <div id="chat-empty" class="chat-empty">
        <span class="empty-logo" aria-hidden="true">💬</span>
        <h1>Chatterly Web</h1>
        <p>Pick a chat on the left and start talking.<br>Every reply below is simulated — no server, no account, no tracking.</p>
      </div>

      <div id="chat-active" class="chat-active" hidden>
        <header class="chat-head">
          <button class="icon-btn back" id="back-btn" type="button" aria-label="Back to chats">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
          </button>
          <span class="avatar" id="chat-avatar" aria-hidden="true"></span>
          <div class="chat-id">
            <b id="chat-name"></b>
            <span id="chat-status"></span>
          </div>
          <button class="icon-btn" id="call-btn" type="button" aria-label="Voice call (demo)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.6 2z"/></svg>
          </button>
          <button class="icon-btn" id="menu-btn" type="button" aria-label="Chat menu">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
          </button>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <div id="typing" class="typing" hidden aria-label="Contact is typing">
          <span class="t-dot"></span><span class="t-dot"></span><span class="t-dot"></span>
        </div>

        <form id="msg-form" class="composer" novalidate>
          <button class="icon-btn" id="emoji-btn" type="button" aria-label="Emoji picker" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.2 1.8 3.5 1.8 3.5-1.8 3.5-1.8"/><circle cx="9" cy="9.5" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="9.5" r="1" fill="currentColor" stroke="none"/></svg>
          </button>
          <label class="sr-only" for="msg-input">Type a message</label>
          <input id="msg-input" type="text" placeholder="Type a message" maxlength="2000" autocomplete="off" />
          <button class="send-btn" id="send-btn" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 20.9 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z"/></svg>
          </button>
        </form>
        <div id="emoji-panel" class="emoji-panel" role="dialog" aria-label="Emoji picker" hidden></div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
